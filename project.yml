name: TrainsNearMe
options:
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "4"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME[sdk=macosx*]: YES
    SUPPORTS_MACCATALYST: NO
    # The App Intents runtime looks the configuration intent up in the main executable; with Xcode's
    # debug dylib it lives elsewhere and the widget loses its "Edit" configuration (ActionNotFound).
    ENABLE_DEBUG_DYLIB: NO
packages:
  SNCFCore:
    path: SNCFCore
targets:
  TrainsNearMe:
    type: application
    supportedDestinations: [macOS, iOS]
    sources: [App]
    dependencies:
      - package: SNCFCore
      - target: TrainsNearMeWidget
    settings:
      base:
        PRODUCT_NAME: Trains near me
        PRODUCT_MODULE_NAME: TrainsNearMe
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).mac
        GENERATE_INFOPLIST_FILE: YES
        # On iOS a free Apple account cannot use App Groups, so that build ships no entitlements
        # and reads the token from SNCF_TOKEN instead.
        CODE_SIGN_ENTITLEMENTS[sdk=iphone*]: ""
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Trains near me
        LSApplicationCategoryType: public.app-category.travel
        UILaunchScreen: {}
        NSLocationUsageDescription: Used only to pick the station closest to you. Only a position rounded to about 100 m is sent to the SNCF API, and only to find that station.
        NSLocationWhenInUseUsageDescription: Used only to pick the station closest to you. Only a position rounded to about 100 m is sent to the SNCF API, and only to find that station.
        SNCFAppGroup: $(TeamIdentifierPrefix)$(BUNDLE_ID_PREFIX)
        SNCFToken: $(SNCF_TOKEN)
    entitlements:
      path: App/TrainsNearMe.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.personal-information.location: true
        com.apple.security.application-groups: [$(TeamIdentifierPrefix)$(BUNDLE_ID_PREFIX)]
  TrainsNearMeWidget:
    type: app-extension
    supportedDestinations: [macOS, iOS]
    sources: [Widget]
    dependencies:
      - package: SNCFCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).mac.widget
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS[sdk=iphone*]: ""
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Trains near me
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSWidgetWantsLocation: true
        NSLocationUsageDescription: Used only to pick the station closest to you. Only a position rounded to about 100 m is sent to the SNCF API, and only to find that station.
        NSLocationWhenInUseUsageDescription: Used only to pick the station closest to you. Only a position rounded to about 100 m is sent to the SNCF API, and only to find that station.
        SNCFAppGroup: $(TeamIdentifierPrefix)$(BUNDLE_ID_PREFIX)
        SNCFToken: $(SNCF_TOKEN)
    entitlements:
      path: Widget/TrainsNearMeWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.personal-information.location: true
        com.apple.security.application-groups: [$(TeamIdentifierPrefix)$(BUNDLE_ID_PREFIX)]
