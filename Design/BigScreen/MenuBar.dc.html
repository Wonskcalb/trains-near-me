<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Menu bar extra</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFC23D;text-decoration:none}a:hover{color:#FFD470}
</style>
</helmet>
<div style="width: 440px; height: 640px; position: relative; overflow: hidden; background: #2B2D31; color: #F2EFE8; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; -webkit-font-smoothing: antialiased">

  <!-- slice of the macOS menu bar, right side -->
  <div style="height: 30px; display: flex; align-items: center; justify-content: flex-end; gap: 14px; padding: 0 14px; background: rgba(20,21,23,0.82); font-size: 13px; font-weight: 500; color: #E8E6E1">
    <span style="display: flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 6px; background: rgba(255,255,255,0.18); font: 600 12.5px 'JetBrains Mono', ui-monospace, monospace">
      <span style="width: 13px; height: 15px; border-radius: 3px; background: {{accent}}; position: relative" aria-hidden="true"><span style="position: absolute; left: 0; right: 0; top: 7px; height: 1px; background: #141517"></span></span>
      17:42 · 2′
    </span>
    <span>Thu 15 Oct  17:40</span>
  </div>

  <!-- popover -->
  <section style="position: absolute; top: 40px; right: 14px; width: 372px; border-radius: 18px; background: #17191C; border: 1px solid rgba(255,255,255,0.10); box-shadow: 0 24px 50px rgba(0,0,0,0.5); padding: 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px" aria-label="Trains near me">

    <div style="display: flex; align-items: center; justify-content: space-between">
      <button style="display: flex; align-items: center; gap: 9px; height: 34px; padding: 0 10px 0 6px; border: 0; border-radius: 10px; background: transparent; color: #F2EFE8; font: 600 15px -apple-system, BlinkMacSystemFont, system-ui, sans-serif">
        <span style="width: 10px; height: 26px; display: flex; flex-direction: column; align-items: center" aria-hidden="true"><span style="width: 7px; height: 7px; border-radius: 4px; border: 1.8px solid #8F8D86; box-sizing: border-box"></span><span style="flex: 1; width: 1.8px; background: #8F8D86"></span><span style="width: 9px; height: 9px; border-radius: 5px; background: {{accent}}"></span></span>
        Grenoble → Voiron
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#8F8D86" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
      <button style="width: 32px; height: 32px; border-radius: 16px; border: 0; background: #23262B; color: #D9D6CE; display: flex; align-items: center; justify-content: center" aria-label="Refresh"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"></path><path d="M20 4v7h-7"></path></svg></button>
    </div>

    <div style="display: flex; align-items: center; gap: 14px">
      <div style="display: flex; align-items: center; gap: 3px" role="img" aria-label="17:42">
        <span style="width: 30px; height: 44px; border-radius: 6px; background: #23262B; position: relative; display: flex; align-items: center; justify-content: center; font: 700 29px 'JetBrains Mono', ui-monospace, monospace; color: {{accent}}">1<span style="position: absolute; left: 0; right: 0; top: 21.5px; height: 1px; background: #0E0F11"></span></span>
        <span style="width: 30px; height: 44px; border-radius: 6px; background: #23262B; position: relative; display: flex; align-items: center; justify-content: center; font: 700 29px 'JetBrains Mono', ui-monospace, monospace; color: {{accent}}">7<span style="position: absolute; left: 0; right: 0; top: 21.5px; height: 1px; background: #0E0F11"></span></span>
        <span style="width: 9px; text-align: center; font: 700 22px 'JetBrains Mono', ui-monospace, monospace; color: {{accent}}">:</span>
        <span style="width: 30px; height: 44px; border-radius: 6px; background: #23262B; position: relative; display: flex; align-items: center; justify-content: center; font: 700 29px 'JetBrains Mono', ui-monospace, monospace; color: {{accent}}">4<span style="position: absolute; left: 0; right: 0; top: 21.5px; height: 1px; background: #0E0F11"></span></span>
        <span style="width: 30px; height: 44px; border-radius: 6px; background: #23262B; position: relative; display: flex; align-items: center; justify-content: center; font: 700 29px 'JetBrains Mono', ui-monospace, monospace; color: {{accent}}">2<span style="position: absolute; left: 0; right: 0; top: 21.5px; height: 1px; background: #0E0F11"></span></span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 3px">
        <span style="font: 600 14px 'JetBrains Mono', ui-monospace, monospace; color: #46C27A">in 2 min</span>
        <span style="font: 500 11.5px 'JetBrains Mono', ui-monospace, monospace; color: #8F8D86">TER 17653 · arr. 18:07</span>
      </div>
    </div>

    <svg width="340" height="44" viewBox="0 0 340 44" style="display: block" role="img" aria-label="17:42 next; 18:12 twelve minutes late; 18:42 cancelled; 19:12 on time; 19:42 twenty-four minutes late; 20:42 on time.">
      <defs><pattern id="mslp" x="8" y="0" width="16.2" height="44" patternUnits="userSpaceOnUse"><rect x="0" y="8" width="3" height="14" rx="1" fill="#3A3631"></rect></pattern></defs>
      <g transform="translate(8,0)">
        <rect x="-1" y="0" width="326" height="30" fill="url(#mslp)"></rect>
        <rect x="31" y="6" width="3" height="18" rx="1" fill="#4A453E"></rect>
        <rect x="128.2" y="6" width="3" height="18" rx="1" fill="#4A453E"></rect>
        <rect x="225.4" y="6" width="3" height="18" rx="1" fill="#4A453E"></rect>
        <rect x="0" y="11" width="324" height="1.6" fill="#9C9A93"></rect>
        <rect x="0" y="18.4" width="324" height="1.6" fill="#9C9A93"></rect>
        <text x="32.4" y="40" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" font-weight="500" fill="#8F8D86">18h</text>
        <text x="129.6" y="40" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" font-weight="500" fill="#8F8D86">19h</text>
        <text x="226.8" y="40" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" font-weight="500" fill="#8F8D86">20h</text>
        <text x="324" y="40" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="9" font-weight="500" fill="#8F8D86">21h</text>
        <path d="M51.8 15.5 Q61.5 3 71.3 15.5" fill="none" stroke="#FF9A55" stroke-width="1.3" stroke-dasharray="2 2"></path>
        <circle cx="51.8" cy="15.5" r="3.2" fill="#17191C" stroke="#FF9A55" stroke-width="1.3"></circle>
        <circle cx="71.3" cy="15.5" r="5" fill="#FF9A55"></circle>
        <circle cx="100.4" cy="15.5" r="4.6" fill="#17191C" stroke="#FF6B5F" stroke-width="1.6"></circle>
        <path d="M98.4 13.5l4 4M102.4 13.5l-4 4" stroke="#FF6B5F" stroke-width="1.4" stroke-linecap="round"></path>
        <circle cx="149" cy="15.5" r="5" fill="#F2EFE8"></circle>
        <path d="M197.6 15.5 Q217 -2 236.5 15.5" fill="none" stroke="#FF6B5F" stroke-width="1.3" stroke-dasharray="2 2"></path>
        <circle cx="197.6" cy="15.5" r="3.2" fill="#17191C" stroke="#FF6B5F" stroke-width="1.3"></circle>
        <circle cx="236.5" cy="15.5" r="5" fill="#FF6B5F"></circle>
        <circle cx="294.8" cy="15.5" r="5" fill="#F2EFE8"></circle>
        <circle cx="3.2" cy="15.5" r="5.5" fill="{{accent}}" stroke="#F2EFE8" stroke-width="2"></circle>
      </g>
    </svg>

    <div style="display: flex; flex-direction: column; border-radius: 12px; background: #1D2024">
      <div style="display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; column-gap: 10px; align-items: center; padding: 9px 12px">
        <span style="font: 700 15px 'JetBrains Mono', ui-monospace, monospace; color: {{accent}}">18:12</span>
        <span style="font: 500 12px 'JetBrains Mono', ui-monospace, monospace; color: #8F8D86">TER 17655 · leaves 18:24</span>
        <span style="font: 700 12px 'JetBrains Mono', ui-monospace, monospace; color: #FF9A55; background: rgba(255,138,61,0.16); padding: 3px 7px; border-radius: 7px">+12</span>
      </div>
      <div style="display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; column-gap: 10px; align-items: center; padding: 9px 12px; border-top: 1px solid rgba(255,255,255,0.06)">
        <span style="font: 700 15px 'JetBrains Mono', ui-monospace, monospace; color: #6E6C66; text-decoration: line-through">18:42</span>
        <span style="font: 500 12px 'JetBrains Mono', ui-monospace, monospace; color: #6E6C66">TER 17657</span>
        <span style="font: 700 10px 'JetBrains Mono', ui-monospace, monospace; letter-spacing: 0.8px; color: #FF6B5F; background: rgba(255,90,78,0.16); padding: 4px 7px; border-radius: 7px">CANCELLED</span>
      </div>
      <div style="display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; column-gap: 10px; align-items: center; padding: 9px 12px; border-top: 1px solid rgba(255,255,255,0.06)">
        <span style="font: 700 15px 'JetBrains Mono', ui-monospace, monospace; color: {{accent}}">19:12</span>
        <span style="font: 500 12px 'JetBrains Mono', ui-monospace, monospace; color: #8F8D86">TER 17659 · arr. 19:37</span>
        <span style="font: 500 12px 'JetBrains Mono', ui-monospace, monospace; color: #8F8D86">1 h 32</span>
      </div>
    </div>

    <div style="display: flex; gap: 6px; flex-wrap: wrap" role="tablist" aria-label="Journeys">
      <button role="tab" aria-selected="true" style="height: 30px; padding: 0 10px; border-radius: 15px; border: 0; background: #F2EFE8; color: #0E0F11; font: 600 12px -apple-system, BlinkMacSystemFont, system-ui, sans-serif">Voiron</button>
      <button role="tab" aria-selected="false" style="height: 30px; padding: 0 10px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.12); background: transparent; color: #D9D6CE; font: 600 12px -apple-system, BlinkMacSystemFont, system-ui, sans-serif; display: flex; align-items: center; gap: 6px"><span style="width: 6px; height: 6px; border-radius: 3px; background: #FF9A55"></span>Lyon P-D</button>
      <button role="tab" aria-selected="false" style="height: 30px; padding: 0 10px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.12); background: transparent; color: #D9D6CE; font: 600 12px -apple-system, BlinkMacSystemFont, system-ui, sans-serif; display: flex; align-items: center; gap: 6px"><span style="width: 6px; height: 6px; border-radius: 3px; background: #FF6B5F"></span>Chambéry</button>
      <button role="tab" aria-selected="false" style="height: 30px; padding: 0 10px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.12); background: transparent; color: #D9D6CE; font: 600 12px -apple-system, BlinkMacSystemFont, system-ui, sans-serif">Near me</button>
    </div>

    <div style="display: flex; flex-direction: column; border-top: 1px solid rgba(255,255,255,0.07); padding-top: 6px; margin: 0 -6px">
      <a href="Main.dc.html" style="display: flex; justify-content: space-between; padding: 7px 8px; border-radius: 7px; color: #F2EFE8; font-size: 13.5px">Open Trains near me<span style="font: 500 12px 'JetBrains Mono', ui-monospace, monospace; color: #8F8D86">⌘O</span></a>
      <a href="Wall.dc.html" style="display: flex; justify-content: space-between; padding: 7px 8px; border-radius: 7px; color: #F2EFE8; font-size: 13.5px">Wall mode on this display<span style="font: 500 12px 'JetBrains Mono', ui-monospace, monospace; color: #8F8D86">⌘3</span></a>
      <span style="display: flex; justify-content: space-between; padding: 7px 8px; font: 500 11px 'JetBrains Mono', ui-monospace, monospace; color: #8F8D86"><span>Data © SNCF · not affiliated</span><span>17:40</span></span>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FFC23D","options":["#FFC23D","#F5E6C8","#7CC4FF","#46C27A"]},"$preview":{"width":440,"height":640}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#FFC23D' };
  }
}
</script>
</body>
</html>
