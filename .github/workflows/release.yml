name: Release

# A version tag on main (v1.3.0) builds iOS and macOS and uploads both to TestFlight.
on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  XCODE_MAJOR: "27"

jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
      - id: version
        name: Version from the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::tag must look like v1.2.3, got $GITHUB_REF_NAME"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # App Store Connect refuses a build number it has already seen, so catch a forgotten bump here
      # rather than after two long archives.
      - name: Build number was bumped
        run: |
          build() { sed -n 's/^ *CURRENT_PROJECT_VERSION: *"\{0,1\}\([0-9][0-9]*\)"\{0,1\}.*/\1/p' | head -1; }
          current=$(build < project.yml)
          previous_tag=$(git tag --list 'v*.*.*' --sort=-v:refname | grep -vx "$GITHUB_REF_NAME" | head -1)
          if [ -n "$previous_tag" ]; then
            previous=$(git show "$previous_tag:project.yml" | build)
            echo "build $current (previous tag $previous_tag: $previous)"
            [ "$current" -gt "${previous:-0}" ] \
              || { echo "::error::bump CURRENT_PROJECT_VERSION in project.yml (still $current, as in $previous_tag)"; exit 1; }
          fi

  upload:
    name: TestFlight (${{ matrix.platform }})
    needs: check
    runs-on: xcode-27
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, macos]
    env:
      DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID_PREFIX: ${{ vars.BUNDLE_ID_PREFIX }}
      MARKETING_VERSION: ${{ needs.check.outputs.version }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Required settings
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          for name in DEVELOPMENT_TEAM BUNDLE_ID_PREFIX ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            eval "value=\${$name:-}"; [ -n "$value" ] || missing="$missing $name"
          done
          [ -z "$missing" ] || { echo "::error::missing repository secrets/variables:$missing (see README › Releasing)"; exit 1; }

      - name: Select Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_${XCODE_MAJOR}*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$xcode" ] || xcode=/Applications/Xcode.app
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version

      - name: App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          key="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s' "$ASC_KEY_P8" > "$key"
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"

      # Optional: without these secrets Xcode falls back to cloud-managed signing, which needs the API
      # key to have the Admin role. With them, the certificates go into a throwaway keychain.
      - name: Import signing certificates
        env:
          DIST_P12: ${{ secrets.DISTRIBUTION_CERT_P12 }}
          INSTALLER_P12: ${{ secrets.MAC_INSTALLER_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.CERTS_P12_PASSWORD }}
        run: |
          [ -n "$DIST_P12" ] || { echo "No certificates given: cloud-managed signing."; exit 0; }
          keychain="$RUNNER_TEMP/release.keychain-db"
          pass=$(uuidgen)
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          for p12 in "$DIST_P12" "$INSTALLER_P12"; do
            [ -n "$p12" ] || continue
            printf '%s' "$p12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
            rm "$RUNNER_TEMP/cert.p12"
          done
          security set-key-partition-list -S apple-tool:,apple: -k "$pass" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

      - name: Archive and upload
        run: sh scripts/release.sh ${{ matrix.platform }} upload

      - name: Clean up
        if: always()
        run: |
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
